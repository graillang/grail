name: ci

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tooling:
    name: tooling checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Unit tests for the cross-platform matrix, packaging and signing
        run: bun test tools/platforms.test.mjs tools/archive.test.mjs tools/sign.test.mjs tools/objects.test.mjs
      - name: Static checks (matrix, docs, workflow, scripts)
        run: bun tools/ci.mjs lint
      - name: Matrix and lane report
        run: |
          bun tools/ci.mjs matrix
          bun tools/ci.mjs plan > ci-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: ci-plan
          path: ci-plan.json
          if-no-files-found: error

  preflight:
    name: stage0 and bootstrap preflight
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.status.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Inspect host, stage0 and published bootstrap
        id: status
        shell: bash
        run: |
          bun tools/ci.mjs preflight --json | tee preflight.json
          echo "ready=$(bun -e "console.log(String(require('./preflight.json').ready))")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: preflight
          path: preflight.json
          if-no-files-found: error

  # Runtime ABI: C contract tests, the hosted Linux oracle and cross-header parsing.
  abi:
    name: runtime ABI contract tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install a C compiler and clang
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld
      - name: ABI, path, handle and header checks
        run: bun tools/abi-test.mjs
      - name: extern "C" scalar FFI through a C shim
        run: bun tools/test-ffi.mjs

  # LLVM backend: the native execution suite with every program lowered through
  # compiler/llvm.grl and clang -O2 (docs/design/llvm-backend.md).
  llvm:
    name: LLVM backend native suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install clang and lld
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
      - name: Native suite through --backend=llvm
        run: |
          export GRAIL_COMPILER="$(bun tools/native.mjs build | tail -1)"
          GRAIL_BACKEND=llvm bun tools/test-native.mjs x86_64

  # The compiler compiles itself twice with identical output (a change the seed accepts but the
  # new compiler rejects in its own source fails here, not at the next bootstrap update).
  selfhost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install clang and lld
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
      - name: Self-hosting fixpoint
        run: bun tools/test-selfhost.mjs

  # Per-module emission (B1 stage 1): `--split` must assemble to the same objects and the same
  # program as the single-file build, for the native corpus, the book and the compiler itself.
  split:
    name: per-module emission agreement
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install clang, lld and llvm tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
      - name: Split and single-file builds agree
        run: bun tools/split-test.mjs

  # Graphics foundation: the C RHI/null-backend suites and the shader permutation
  # test. DXC-dependent cases skip (and say so) when the pinned compiler is absent.
  graphics:
    name: graphics C ABI and shader tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install a C compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: RHI, device and wire suites
        run: make -C graphics test
      - name: Shader permutation bytecode tests
        run: bun test graphics/tests/shader_permutations.test.mjs

  # Native Linux lanes. These run only when the checked-in bootstrap matches
  # the compiler sources (or CI provides GRAIL_COMPILER); otherwise preflight
  # reports the blocker and keeps the workflow green.
  linux-native:
    name: linux native ${{ matrix.platform }}
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install clang and LLD
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
      - name: Build, test and package
        run: |
          bun tools/ci.mjs build --platform ${{ matrix.platform }}
          bun tools/ci.mjs test --platform ${{ matrix.platform }}
          bun tools/ci.mjs package --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  # Cross-build lane: one x86-64 host builds and packages AArch64 and RISC-V64,
  # executes both under qemu-user, and verifies the artifact architecture.
  linux-cross:
    name: linux cross ${{ matrix.platform }}
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-aarch64
            qemu: qemu-aarch64-static
          - platform: linux-riscv64
            qemu: qemu-riscv64-static
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install clang, LLD and qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld qemu-user-static
          ${{ matrix.qemu }} --version
      - name: Build the host compiler once
        run: bun tools/ci.mjs build --platform linux-x86_64
      - name: Build, cross-test and package
        run: |
          bun tools/ci.mjs build --platform ${{ matrix.platform }}
          bun tools/ci.mjs test --platform ${{ matrix.platform }}
          bun tools/ci.mjs package --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  # Windows x86-64: a real PE/COFF cross lane. It builds the compiler as a PE image
  # and runs static object/image checks. The Windows runtime is not implemented, so
  # this job never executes the image and publishes a build-only artifact.
  windows-cross:
    name: windows x86-64 cross (build-only, static)
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install clang, LLD and LLVM inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          lld-link --version
          llvm-readobj --version
      - name: Build the host compiler and the Windows PE image
        run: |
          bun tools/ci.mjs build --platform linux-x86_64
          bun tools/ci.mjs build --platform windows-x86_64
      - name: Static COFF/PE checks (no execution)
        run: bun tools/ci.mjs test --platform windows-x86_64
      - name: Package the build-only zip
        run: bun tools/ci.mjs package --platform windows-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-x86_64
          path: dist/
          if-no-files-found: error

  # Non-executable target object bundles for Windows x86-64 and macOS. These are
  # relocatable COFF/Mach-O objects with checksums and provenance; the archives
  # contain no executable and the job never runs a target binary.
  object-bundles:
    name: target object bundle ${{ matrix.platform }} (non-executable)
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
          - platform: macos-aarch64
          - platform: macos-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install clang, LLD and LLVM inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          llvm-objdump --version
          llvm-nm --version
      - name: Build the host compiler
        run: bun tools/ci.mjs build --platform linux-x86_64
      - name: Build and package the object bundle
        run: |
          compiler="$PWD/$(ls dist/grail-*-linux-x86_64-compiler)"
          bun tools/ci.mjs objects --platform ${{ matrix.platform }} --compiler "$compiler"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}-objects
          path: dist/*-objects.*
          if-no-files-found: error

  # macOS static checks: Mach-O objects and linked images, no execution.
  macos-static:
    name: macOS Mach-O static checks
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install clang, LLD and LLVM inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
      - name: Build the host compiler
        run: bun tools/ci.mjs build --platform linux-x86_64
      - name: Mach-O object and executable checks (no execution)
        run: |
          compiler="$PWD/$(ls dist/grail-*-linux-x86_64-compiler)"
          bun tools/ci.mjs test --platform macos-aarch64 --compiler "$compiler"

  # DWARF line/info tables: build one program with --debug and verify .debug_line rows and
  # .debug_info DIEs with llvm-dwarfdump and `grail debug lines|info`. Linux x86-64 only.
  debug-lines:
    name: DWARF line table and info
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install clang, LLD and llvm-dwarfdump
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          llvm-dwarfdump --version
      - name: Build the host compiler
        run: bun tools/ci.mjs build --platform linux-x86_64
      - name: Verify line rows, DIEs and the debug inspection commands
        run: |
          compiler="$PWD/$(ls dist/grail-*-linux-x86_64-compiler)"
          GRAIL_COMPILER="$compiler" bun tools/test-debug-lines.mjs

  # Sampling profiler: a SIGPROF/setitimer sampler in the program's own runtime, symbolised from
  # its ELF .symtab. Builds a hot-loop fixture and checks that the hot function dominates.
  profiler:
    name: sampling profiler
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install clang and LLD
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
      - name: Build the host compiler
        run: bun tools/ci.mjs build --platform linux-x86_64
      - name: Profile a hot loop and check attribution
        run: |
          compiler="$PWD/$(ls dist/grail-*-linux-x86_64-compiler)"
          GRAIL_COMPILER="$compiler" bun tools/test-profile.mjs

  # LSP MVP: a real stdio session against the compiler's diagnostics interface.
  # The Grail language server: a real stdio session against the compiler's diagnostics.
  lsp:
    name: LSP stdio session
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install clang and LLD
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
      - name: Build the host compiler
        run: bun tools/ci.mjs build --platform linux-x86_64
      - name: Handshake, diagnostics, definition and malformed input over stdio
        run: bun tools/lsp-test.mjs

  # Planned lanes run detection and scaffolding only. `--allow-blocked` turns
  # the expected "compiler backend not implemented" result into a green job, so
  # the matrix stays covered without pretending a Windows/macOS binary exists.
  windows:
    name: windows ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-2022
          - platform: windows-aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Detect toolchain and report the backend blocker
        shell: bash
        run: |
          bun tools/ci.mjs detect --platform ${{ matrix.platform }}
          bun tools/ci.mjs build --platform ${{ matrix.platform }} --allow-blocked
      - name: Package/sign scaffolding stays printable
        shell: bash
        run: bun tools/ci.mjs plan

  macos:
    name: macos ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            runner: macos-14
          - platform: macos-x86_64
            runner: macos-13
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Detect SDK/toolchain and report the backend blocker
        run: |
          bun tools/ci.mjs detect --platform ${{ matrix.platform }}
          bun tools/ci.mjs build --platform ${{ matrix.platform }} --allow-blocked
      - name: Signing/notarization dry-run plan
        run: bun tools/ci.mjs sign --platform ${{ matrix.platform }} --artifact grail-placeholder.tar.gz --tree unpacked

  release-sign:
    name: release signature hook (${{ matrix.platform }})
    needs: [linux-native, linux-cross]
    if: startsWith(github.ref, 'refs/tags/v') && vars.RELEASE_SIGNING == 'true'
    runs-on: ubuntu-24.04
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
          - platform: linux-aarch64
          - platform: linux-riscv64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-linux-*
          path: dist
          merge-multiple: true
      - name: Import the release key
        env:
          GRAIL_GPG_PRIVATE_KEY: ${{ secrets.GRAIL_GPG_PRIVATE_KEY }}
        run: printf '%s' "$GRAIL_GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Sign the archive for this lane
        env:
          GRAIL_GPG_KEY: ${{ secrets.GRAIL_GPG_KEY }}
        run: |
          artifact=$(ls dist/grail-*-${{ matrix.platform }}.tar.gz)
          bun tools/ci.mjs sign --platform ${{ matrix.platform }} --artifact "$artifact" --execute
      - uses: actions/upload-artifact@v4
        with:
          name: signed-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
