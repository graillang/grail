name: ci

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tooling:
    name: tooling checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Unit tests for the cross-platform matrix, packaging and signing
        run: bun test tools/platforms.test.mjs tools/archive.test.mjs tools/sign.test.mjs tools/objects.test.mjs
      - name: Static checks (matrix, docs, workflow, scripts)
        run: bun tools/ci.mjs lint
      - name: Matrix and lane report
        run: |
          bun tools/ci.mjs matrix
          bun tools/ci.mjs plan > ci-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: ci-plan
          path: ci-plan.json
          if-no-files-found: error

  preflight:
    name: stage0 and bootstrap preflight
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.status.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install clang and LLD (the toolchain the gated lanes use)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
      - name: Inspect host, stage0 and published bootstrap
        id: status
        shell: bash
        run: |
          bun tools/ci.mjs preflight --json | tee preflight.json
          echo "ready=$(bun -e "console.log(String(require('./preflight.json').ready))")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: preflight
          path: preflight.json
          if-no-files-found: error

  # Runtime ABI: C contract tests, the hosted Linux oracle and cross-header parsing.
  abi:
    name: runtime ABI contract tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install a C compiler and clang
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld llvm
      - name: ABI, path, handle and header checks
        run: bun tools/abi-test.mjs
      - name: extern "C" scalar FFI through a C shim
        run: bun tools/test-ffi.mjs
      - name: C header importer (grail bindgen)
        run: bun tools/bindgen-test.mjs

  # LLVM backend: the native execution suite with every program lowered through
  # compiler/llvm.grl and clang -O2 (docs/design/llvm-backend.md).
  llvm:
    name: LLVM backend native suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install clang and lld
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
      - name: Native suite through --backend=llvm
        run: |
          export GRAIL_COMPILER="$(bun tools/native.mjs build | tail -1)"
          GRAIL_BACKEND=llvm bun tools/test-native.mjs x86_64

  # The compiler compiles itself twice with identical output (a change the seed accepts but the
  # new compiler rejects in its own source fails here, not at the next bootstrap update).
  selfhost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install clang and lld
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
      - name: Self-hosting fixpoint
        run: bun tools/test-selfhost.mjs

  # Per-module emission (B1 stage 1): `--split` must assemble to the same objects and the same
  # program as the single-file build, for the native corpus, the book and the compiler itself.
  split:
    name: per-module emission agreement
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install clang, lld and llvm tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
      - name: Split and single-file builds agree
        run: bun tools/split-test.mjs

  # B1 stage 2: checked module interfaces. Emits one interface per module and proves that a program
  # built against them behaves like the program built from source, for the corpus and for the
  # compiler compiling itself.
  interfaces:
    name: checked module interfaces
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install clang and lld
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
      - name: Interfaces agree with their sources
        run: bun tools/interface-test.mjs
      - name: Overflow modes accept the same programs
        run: bun tools/overflow-parity-test.mjs

  # B1 stage 4: the build cache. Proves that a cached build is the uncached build byte for byte, that
  # an unchanged program is a full hit, that one module's edit misses that module and its importers
  # and nothing else, that a flag change misses everything, that a tampered interface misses the
  # importer, and that a corrupted entry is a rebuild rather than a wrong binary.
  cache:
    name: build cache
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install clang and lld
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
      - name: The cache reuses what is unchanged and nothing else
        run: bun tools/cache-test.mjs

  # Graphics foundation: the C RHI/null-backend suites and the shader permutation
  # test. DXC-dependent cases skip (and say so) when the pinned compiler is absent.
  graphics:
    name: graphics C ABI and shader tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install a C compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: RHI, device and wire suites
        run: make -C graphics test
      - name: Shader permutation bytecode tests
        run: bun test graphics/tests/shader_permutations.test.mjs

  # Native Linux lanes. These run only when the checked-in bootstrap matches
  # the compiler sources (or CI provides GRAIL_COMPILER); otherwise preflight
  # reports the blocker and keeps the workflow green.
  linux-native:
    name: linux native ${{ matrix.platform }}
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install clang and LLD
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
      - name: Build, test and package
        run: |
          bun tools/ci.mjs build --platform ${{ matrix.platform }}
          bun tools/ci.mjs test --platform ${{ matrix.platform }}
          bun tools/ci.mjs package --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  # Cross-build lane: one x86-64 host builds and packages AArch64 and RISC-V64,
  # executes both under qemu-user, and verifies the artifact architecture.
  # The suite runs the cross-built compiler itself under qemu for every case, which took 4h47m on
  # AArch64 and ran into GitHub's six-hour job limit on RISC-V64 as one job. Each platform's cases
  # are split across shard jobs (GRAIL_TEST_SHARD, read by test-native.mjs); shard 1 also packages
  # and uploads the platform's artifact.
  linux-cross:
    name: linux cross ${{ matrix.platform }} (shard ${{ matrix.shard }})
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-aarch64
            qemu: qemu-aarch64-static
            shard: 1/3
          - platform: linux-aarch64
            qemu: qemu-aarch64-static
            shard: 2/3
          - platform: linux-aarch64
            qemu: qemu-aarch64-static
            shard: 3/3
          - platform: linux-riscv64
            qemu: qemu-riscv64-static
            shard: 1/4
          - platform: linux-riscv64
            qemu: qemu-riscv64-static
            shard: 2/4
          - platform: linux-riscv64
            qemu: qemu-riscv64-static
            shard: 3/4
          - platform: linux-riscv64
            qemu: qemu-riscv64-static
            shard: 4/4
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install clang, LLD and qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm qemu-user-static
          ${{ matrix.qemu }} --version
      - name: Build the host compiler once
        run: bun tools/ci.mjs build --platform linux-x86_64
      - name: Build and cross-test this shard
        env:
          # The emulated compiler compiles the compiler under qemu: well past the 40-minute default.
          GRAIL_COMMAND_TIMEOUT: '7200'
          GRAIL_TEST_SHARD: ${{ matrix.shard }}
        run: |
          bun tools/ci.mjs build --platform ${{ matrix.platform }}
          bun tools/ci.mjs test --platform ${{ matrix.platform }}
      - name: Package
        if: startsWith(matrix.shard, '1/')
        run: bun tools/ci.mjs package --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        if: startsWith(matrix.shard, '1/')
        with:
          name: dist-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  # Windows x86-64: a real PE/COFF cross lane. It builds the compiler as a PE image
  # and runs static object/image checks. The Windows runtime is not implemented, so
  # this job never executes the image and publishes a build-only artifact.
  windows-cross:
    name: windows x86-64 cross (build-only, static)
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install clang, LLD and LLVM inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          lld-link --version
          llvm-readobj --version
      - name: Build the host compiler and the Windows PE image
        run: |
          bun tools/ci.mjs build --platform linux-x86_64
          bun tools/ci.mjs build --platform windows-x86_64
      - name: Static COFF/PE checks (no execution)
        run: bun tools/ci.mjs test --platform windows-x86_64
      - name: Package the build-only zip
        run: bun tools/ci.mjs package --platform windows-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-x86_64
          path: dist/
          if-no-files-found: error

  # Non-executable target object bundles for Windows x86-64 and macOS. These are
  # relocatable COFF/Mach-O objects with checksums and provenance; the archives
  # contain no executable and the job never runs a target binary.
  object-bundles:
    name: target object bundle ${{ matrix.platform }} (non-executable)
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
          - platform: macos-aarch64
          - platform: macos-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install clang, LLD and LLVM inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          llvm-objdump --version
          llvm-nm --version
      - name: Build the host compiler
        run: bun tools/ci.mjs build --platform linux-x86_64
      - name: Build and package the object bundle
        run: |
          compiler="$PWD/$(ls dist/grail-*-linux-x86_64-compiler)"
          bun tools/ci.mjs objects --platform ${{ matrix.platform }} --compiler "$compiler"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}-objects
          path: dist/*-objects.*
          if-no-files-found: error

  # macOS static checks: Mach-O objects and linked images, no execution.
  macos-static:
    name: macOS Mach-O static checks
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install clang, LLD and LLVM inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          command -v ld64.lld || sudo ln -s "$(ls /usr/bin/ld64.lld-* /usr/lib/llvm-*/bin/ld64.lld 2>/dev/null | sort -V | tail -1)" /usr/local/bin/ld64.lld
      - name: Build the host compiler
        run: bun tools/ci.mjs build --platform linux-x86_64
      - name: Mach-O object and executable checks (no execution)
        run: |
          compiler="$PWD/$(ls dist/grail-*-linux-x86_64-compiler)"
          bun tools/ci.mjs test --platform macos-aarch64 --compiler "$compiler"

  # DWARF line/info tables: build one program with --debug and verify .debug_line rows and
  # .debug_info DIEs with llvm-dwarfdump and `grail debug lines|info`. Linux x86-64 only.
  debug-lines:
    name: DWARF line table and info
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install clang, LLD and llvm-dwarfdump
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm gdb
          llvm-dwarfdump --version
      - name: Build the host compiler
        run: bun tools/ci.mjs build --platform linux-x86_64
      - name: Verify line rows, DIEs and the debug inspection commands
        run: |
          compiler="$PWD/$(ls dist/grail-*-linux-x86_64-compiler)"
          GRAIL_COMPILER="$compiler" bun tools/test-debug-lines.mjs

  # Sampling profiler: a SIGPROF/setitimer sampler in the program's own runtime, symbolised from
  # its ELF .symtab. Builds a hot-loop fixture and checks that the hot function dominates.
  profiler:
    name: sampling profiler
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install clang and LLD
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
      - name: Build the host compiler
        run: bun tools/ci.mjs build --platform linux-x86_64
      - name: Profile a hot loop and check attribution
        run: |
          compiler="$PWD/$(ls dist/grail-*-linux-x86_64-compiler)"
          GRAIL_COMPILER="$compiler" bun tools/test-profile.mjs

  # LSP MVP: a real stdio session against the compiler's diagnostics interface.
  # The Grail language server: a real stdio session against the compiler's diagnostics.
  lsp:
    name: LSP stdio session
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install clang and LLD
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
      - name: Build the host compiler
        run: bun tools/ci.mjs build --platform linux-x86_64
      - name: Handshake, diagnostics, definition and malformed input over stdio
        run: bun tools/lsp-test.mjs

  # ---- native toolchains ---------------------------------------------------------------------
  # One Linux job cross-builds the compiler for the two operating systems whose own binaries this
  # workflow then exercises: grail.exe (PE/COFF) and the Mach-O grail. tools/windows.mjs and
  # tools/native.mjs are the same entry points a developer runs locally.
  native-toolchains:
    name: cross-built native compilers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install clang, LLD and LLVM inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          # Ubuntu ships the Mach-O linker only under its versioned name.
          command -v ld64.lld || sudo ln -s "$(ls /usr/bin/ld64.lld-* /usr/lib/llvm-*/bin/ld64.lld 2>/dev/null | sort -V | tail -1)" /usr/local/bin/ld64.lld
          ld64.lld --version
      - name: Build grail.exe and the Mach-O grail
        run: |
          mkdir -p native
          cp "$(bun tools/windows.mjs compiler)" native/grail.exe
          cp "$(bun tools/native.mjs compiler --target macos-aarch64)" native/grail-macos-aarch64
          file native/grail.exe native/grail-macos-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: native-compilers
          path: native/
          if-no-files-found: error

  # Windows x86-64, natively. The downloaded grail.exe is the compiler; every step below is a
  # command tools/windows.mjs runs under Wine on Linux, so what CI exercises is exactly what the
  # local Wine check exercises, with real Win32 underneath. LLVM is the whole toolchain: clang
  # assembles, llvm-ar writes the import library and lld-link links - no Visual Studio is installed
  # or needed.
  windows-native:
    name: windows-x86_64 native
    needs: native-toolchains
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/download-artifact@v4
        with:
          name: native-compilers
          path: native
      - name: LLVM toolchain (clang, lld-link, llvm-ar)
        run: |
          if command -v clang >/dev/null 2>&1; then
            echo "LLVM found on PATH"
          else
            choco install llvm -y --no-progress
            echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"
          fi
          clang --version | head -1
          lld-link --version | head -1
          llvm-ar --version | head -1
      - name: The native compiler builds and runs book examples
        run: |
          mkdir -p out
          ./native/grail.exe build --target windows-x86_64 book/examples/hello.grl -o out/hello.exe
          ./out/hello.exe > out/hello.txt
          grep -qx "Hello, world!" out/hello.txt
          ./native/grail.exe build --target windows-x86_64 book/examples/numbers.grl -o out/numbers.exe
          ./out/numbers.exe > out/numbers.txt
          grep -qx "42" out/numbers.txt
          ./native/grail.exe build --target windows-x86_64 book/examples/arguments.grl -o out/arguments.exe
          ./out/arguments.exe alpha > out/arguments.txt
          grep -qx "5" out/arguments.txt
      - name: The native compiler builds and runs corpus cases
        run: |
          set -x
          # record_pointers links `lib "shim.o"`: the C shim tools/test-ffi.mjs builds elsewhere.
          clang --target=x86_64-pc-windows-msvc -O1 -fno-stack-protector -c tests/ffi/shim.c -o tests/ffi/shim.o
          cp tests/ffi/shim.o shim.o
          ./native/grail.exe build --target windows-x86_64 tests/concurrency/scope_tasks.grl -o out/tasks.exe
          ./out/tasks.exe > out/tasks.txt
          printf '42\n9\n' > out/tasks.expected
          diff out/tasks.txt out/tasks.expected
          ./native/grail.exe build --target windows-x86_64 tests/ffi/record_pointers.grl -o out/ffi.exe
          ./out/ffi.exe > out/ffi.txt
          head -1 out/ffi.txt | grep -qx "13"
      - name: Self-compile, then run the compiler it produced
        env:
          # No Wine: the compiler binary runs directly on this host.
          GRAIL_WINE: ''
        run: bun tools/windows.mjs selfhost --existing native/grail.exe --full
      - uses: actions/upload-artifact@v4
        with:
          name: windows-native-output
          path: out/
          if-no-files-found: error

  # macOS arm64, natively, on Apple hardware: same shape as the Windows lane, with the SDK the
  # runner already has. GRAIL_LINKER=ld uses Apple's own ld64, which is what a macOS user has;
  # LLVM's ld64.lld works too and is the default.
  macos-native:
    name: macos-aarch64 native
    needs: native-toolchains
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/download-artifact@v4
        with:
          name: native-compilers
          path: native
      - name: SDK and toolchain
        run: |
          xcode-select -p
          echo "GRAIL_SDK=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          clang --version | head -1
          ld -v 2>&1 | head -1
      - name: The native compiler builds and runs book examples
        env:
          GRAIL_LINKER: ld
        run: |
          set -x
          chmod +x native/grail-macos-aarch64
          mkdir -p out
          ./native/grail-macos-aarch64 build --target macos-aarch64 book/examples/hello.grl -o out/hello
          ./out/hello > out/hello.txt
          grep -qx "Hello, world!" out/hello.txt
          ./native/grail-macos-aarch64 build --target macos-aarch64 book/examples/numbers.grl -o out/numbers
          ./out/numbers > out/numbers.txt
          grep -qx "42" out/numbers.txt
          ./native/grail-macos-aarch64 build --target macos-aarch64 book/examples/floats.grl -o out/floats
          ./out/floats | head -1 | grep -qx "0.30000000000000004"
      - name: The native compiler builds and runs corpus cases
        env:
          GRAIL_LINKER: ld
        run: |
          # Sequential programs only: the Mach-O runtime cannot start OS threads yet (darwin.grl
          # rt_thread), so task-parallel corpus cases are not run on this lane.
          for e in records vectors enums closures; do
            ./native/grail-macos-aarch64 build --target macos-aarch64 book/examples/$e.grl -o out/$e
            ./out/$e > out/$e.txt
            python3 -c "import json,sys; d=json.load(open('book/book.json'))['examples']; want=[x['output'] for x in d if x['id']==sys.argv[1]][0]; got=open('out/'+sys.argv[1]+'.txt').read(); sys.exit(0 if got==want else print(sys.argv[1], 'differs', repr(got[:200])) or 1)" $e
          done
      - name: Self-compile
        env:
          GRAIL_LINKER: ld
        run: |
          ./native/grail-macos-aarch64 --module-root lib --target macos-aarch64 out/stage2.s \
            compiler/native.grl compiler/lexer.grl compiler/ownership.grl compiler/machine.grl \
            compiler/optimize.grl compiler/llvm.grl compiler/ir.grl compiler/fncache.grl compiler/jobs.grl \
            compiler/asm_x86.grl compiler/asm_a64.grl compiler/asm_rv64.grl compiler/elf.grl compiler/coff.grl \
            compiler/macho.grl compiler/fmt.grl compiler/explain.grl compiler/bindgen.grl compiler/pkg.grl \
            compiler/docgen.grl compiler/cli.grl compiler/runtime.grl compiler/darwin.grl
          test -s out/stage2.s
      - uses: actions/upload-artifact@v4
        with:
          name: macos-native-output
          path: out/
          if-no-files-found: error

  # Planned lanes run detection and scaffolding only. `--allow-blocked` turns
  # the expected "compiler backend not implemented" result into a green job, so
  # the matrix stays covered without pretending a Windows/macOS binary exists.
  # windows-x86_64 is a native lane above; windows-aarch64 stays a planned lane (the compiler's
  # ARM64 Win32 codegen is not implemented yet, so there is nothing to run).
  windows:
    name: windows ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Detect toolchain and report the backend blocker
        shell: bash
        run: |
          bun tools/ci.mjs detect --platform ${{ matrix.platform }}
          bun tools/ci.mjs build --platform ${{ matrix.platform }} --allow-blocked
      - name: Package/sign scaffolding stays printable
        shell: bash
        run: bun tools/ci.mjs plan

  # macos-aarch64 is a native lane above; macos-x86_64 stays here as the signing dry-run lane.
  macos:
    name: macos ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Detect SDK/toolchain and report the backend blocker
        run: |
          bun tools/ci.mjs detect --platform ${{ matrix.platform }}
          bun tools/ci.mjs build --platform ${{ matrix.platform }} --allow-blocked
      - name: Signing/notarization dry-run plan
        run: bun tools/ci.mjs sign --platform ${{ matrix.platform }} --artifact grail-placeholder.tar.gz --tree unpacked

  release-sign:
    name: release signature hook (${{ matrix.platform }})
    needs: [linux-native, linux-cross]
    if: startsWith(github.ref, 'refs/tags/v') && vars.RELEASE_SIGNING == 'true'
    runs-on: ubuntu-24.04
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
          - platform: linux-aarch64
          - platform: linux-riscv64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-linux-*
          path: dist
          merge-multiple: true
      - name: Import the release key
        env:
          GRAIL_GPG_PRIVATE_KEY: ${{ secrets.GRAIL_GPG_PRIVATE_KEY }}
        run: printf '%s' "$GRAIL_GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Sign the archive for this lane
        env:
          GRAIL_GPG_KEY: ${{ secrets.GRAIL_GPG_KEY }}
        run: |
          artifact=$(ls dist/grail-*-${{ matrix.platform }}.tar.gz)
          bun tools/ci.mjs sign --platform ${{ matrix.platform }} --artifact "$artifact" --execute
      - uses: actions/upload-artifact@v4
        with:
          name: signed-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
