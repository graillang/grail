# Reference generators that need Borg's ACP crate.
#
# This crate is deliberately separate from `../ref`: `agent-client-protocol-schema` enables
# serde_json's `preserve_order`, which turns a JSON object into an insertion-ordered map and would
# silently change every canonical rendering the other references produce. Cargo unifies features
# per build graph, so the only way to keep one reference's dependencies from redefining another's
# output is to keep them in different manifests.
[package]
name = "borg-port-reference-acp"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The envelope types Borg's ACP support uses.
agent-client-protocol-schema = "1.5.0"
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
