# Reference generators for the Borg Agent port. These are not part of any Grail build: they exist
# so every committed expectation can be regenerated from Borg's own JSON semantics (serde_json with
# arbitrary_precision, the feature set Borg compiles with) rather than restated by hand.
#
#   cargo run --offline --manifest-path borg/tests/parity/ref/Cargo.toml --bin json -- <fixtures...>
#   cargo run --offline --manifest-path borg/tests/parity/ref/Cargo.toml --bin wire -- <fixtures...>
[package]
name = "borg-port-reference"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Exactly the version and feature set that crates/borg-* build with (workspace Cargo.toml).
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
